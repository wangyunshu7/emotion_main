services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emotion
      POSTGRES_PASSWORD: emotion
      POSTGRES_DB: emotion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - emotion_dev_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotion -d emotion"]
      interval: 5s
      retries: 10
volumes:
  emotion_dev_pg:
