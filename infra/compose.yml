services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: emotion
    volumes:
      - emotion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotion -d emotion"]
      interval: 5s
      retries: 20
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://emotion:${POSTGRES_PASSWORD}@db:5432/emotion
      CONTENT_ROOT: /content
      PRIVACY_LEDGER_ROOT: /runtime/privacy
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment: *backend_environment
    volumes:
      - privacy_ledger:/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: ../.env
    environment: *backend_environment
    command: ["python", "-m", "app.jobs.runner"]
    volumes:
      - privacy_ledger:/runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/runtime/worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<120"]
      interval: 30s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  emotion_pg:
  privacy_ledger:
