[project]
name = "emotion-diary-api"
version = "0.1.0"
description = "Private emotion diary and self-care API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3",
  "httpx>=0.27,<1", "tzdata>=2024.1", "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
