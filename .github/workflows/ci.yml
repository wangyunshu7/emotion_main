name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emotion
          POSTGRES_PASSWORD: emotion
          POSTGRES_DB: emotion_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U emotion -d emotion_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://emotion:emotion@127.0.0.1:5432/emotion_test
      E2E_DATABASE_URL: postgresql+psycopg://emotion:emotion@127.0.0.1:5432/emotion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: python scripts/setup.py
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -q
        working-directory: backend
      - run: uv run python ../scripts/export_openapi.py
        working-directory: backend
      - run: npm ci && npm run generate:api && npm run lint && npm run typecheck && npm run test -- --run && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
